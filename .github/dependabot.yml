version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
  frontend:
    schedule:
      interval: "monthly"
  infra:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns:
      - "*"
    # Keep in sync with `# do-not-upgrade` markers in Cargo.toml files
    ignore:
      - dependency-name: "reqwest"
      - dependency-name: "reqwest-middleware"
      - dependency-name: "reqwest-retry"
      - dependency-name: "usvg"
    multi-ecosystem-group: "backend"

  - package-ecosystem: "docker"
    directory: "/crates/cli"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    # dist regenerates release.yml (`dist generate`), so its actions are
    # updated by bumping cargo-dist-version in dist-workspace.toml instead
    exclude-paths:
      - ".github/workflows/release.yml"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "npm"
    directories:
      - "/ui/common"
      - "/ui/embed"
      - "/ui/embed-item"
      - "/ui/webapp"
    patterns:
      - "*"
    # apexcharts is deliberately held on 3.x (see ui/webapp/README.md)
    ignore:
      - dependency-name: "apexcharts"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "frontend"
