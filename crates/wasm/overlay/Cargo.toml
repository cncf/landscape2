[package]
name = "landscape2-overlay"
description = "Landscape2 overlay data provider"
repository = "https://github.com/cncf/landscape2"
readme = "../../../README.md"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
landscape2-core = { path = "../../core" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
ts-rs = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[features]
ts = ["dep:ts-rs", "landscape2-core/ts"]

[package.metadata.cargo-machete]
# Used without a direct reference: the `wasm_bindgen` macro expands async
# exports into `wasm_bindgen_futures` calls
ignored = ["wasm-bindgen-futures"]
