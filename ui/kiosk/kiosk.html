<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ foundation }} Landscape</title>
    {% if let Some(favicon) = favicon %}
    <link rel="icon" href="{{ favicon }}" />
    {% endif %}
    <style>
      :root {
        color-scheme: light;
        --color1: {{ colors.color1 }};
        --color2: {{ colors.color2 }};
        --color3: {{ colors.color3 }};
        --color4: {{ colors.color4 }};
        --color5: {{ colors.color5 }};
        --color6: {{ colors.color6 }};
        --color7: {{ colors.color7 }};
        --page-bg: #f8f9fa;
        --surface: #ffffff;
        --surface-soft: #f8f9fa;
        --text: #10233a;
        --muted: #586579;
        --border: rgba(16, 35, 58, 0.12);
        --shadow: 0 10px 28px rgba(16, 35, 58, 0.06);
        --badge-muted-bg: rgba(16, 35, 58, 0.08);
        --pill-border: rgba(16, 35, 58, 0.08);
        --focus-ring: rgba(0, 107, 204, 0.1);
        --link-hover-bg: rgba(16, 35, 58, 0.04);
        --radius: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page-bg: #08131f;
          --surface: #102133;
          --surface-soft: #13283f;
          --text: #f1f7ff;
          --muted: #aac0d5;
          --border: rgba(180, 219, 255, 0.12);
          --shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
          --badge-muted-bg: rgba(180, 219, 255, 0.14);
          --pill-border: rgba(180, 219, 255, 0.12);
          --focus-ring: rgba(96, 149, 214, 0.18);
          --link-hover-bg: rgba(180, 219, 255, 0.08);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page-bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif,
          Roboto,
          "Noto Sans",
          Ubuntu,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol";
        color: var(--text);
        background: var(--page-bg);
      }

      a {
        color: var(--color1);
      }

      img {
        display: block;
        max-width: 100%;
      }

      .page {
        min-height: 100vh;
        padding: 16px 14px 28px;
      }

      .shell {
        width: min(100%, 860px);
        margin: 0 auto;
      }

      .status-card,
      .hero,
      .section-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .status-card {
        min-height: calc(100vh - 52px);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .status-content {
        width: min(100%, 440px);
        text-align: center;
      }

      .spinner {
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        border: 4px solid color-mix(in srgb, var(--color1) 18%, transparent);
        border-top-color: var(--color1);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .status-title {
        margin: 0 0 10px;
        font-size: 1.45rem;
        line-height: 1.15;
      }

      .status-text {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .status-actions {
        margin-top: 20px;
      }

      .button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--color1);
        background: var(--color1);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      .hero {
        padding: 24px 18px 30px;
      }

      .hero-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px;
        gap: 20px;
        align-items: center;
      }

      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }

      .hero-logo {
        justify-self: end;
      }

      .project-logo,
      .logo-fallback {
        width: 72px;
        height: 72px;
      }

      .project-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        object-fit: contain;
      }

      .logo-fallback {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--color1);
        font-size: 2rem;
        font-weight: 500;
      }

      .title {
        margin: 0;
        font-size: 1.2rem;
        line-height: 1.3;
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .description {
        margin: 26px 0 24px;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.6;
      }

      .badge-row,
      .stat-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge-row {
        margin-top: 10px;
      }

      .badge,
      .stat-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 5px 10px;
        font-size: 0.74rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .badge {
        border-radius: 999px;
      }

      .badge-foundation {
        background: var(--color1);
        color: #ffffff;
      }

      .badge-maturity {
        background: var(--badge-muted-bg);
        color: var(--text);
      }

      .badge-maturity.archived {
        background: #f59f00;
        color: #ffffff;
      }

      .stat-row {
        margin-top: 16px;
        gap: 10px;
      }

      .stat-pill {
        gap: 8px;
        justify-content: flex-start;
        flex: 0 0 100%;
        background: var(--surface-soft);
        border: 1px solid var(--pill-border);
        border-radius: 8px;
        color: var(--text);
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.88rem;
        font-weight: 500;
        padding: 8px 12px;
      }

      .stat-pill:nth-child(-n + 2) {
        flex-basis: calc((100% - 10px) / 2);
      }

      .stat-label {
        color: var(--muted);
        font-weight: 500;
      }

      .stat-value {
        font-weight: 600;
      }

      .sections {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .section-card {
        padding: 18px 20px;
      }

      .section-title {
        margin: 0 0 18px;
        font-size: 0.96rem;
        font-weight: 700;
      }

      .link-list {
        display: grid;
        gap: 14px;
      }

      .link-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 34px;
        padding: 4px 8px 4px 16px;
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
        background: transparent;
        border: 0;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 0.16s ease,
          color 0.16s ease;
      }

      .link-item:focus-visible {
        background: var(--link-hover-bg);
        color: var(--color1);
        box-shadow: none;
        outline: none;
      }

      .link-icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        overflow: visible;
      }

      .link-item:focus-visible .link-icon {
        color: var(--color1);
      }

      .link-icon svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .link-copy {
        display: inline-flex;
        align-items: center;
      }

      .link-label {
        font-weight: 400;
        font-size: 0.98rem;
        line-height: 1.35;
      }

      .footer-card {
        margin-top: 20px;
        padding: 0 16px;
        color: var(--muted);
        text-align: center;
        font-size: 0.84rem;
        font-weight: 400;
      }

      .footer-card a {
        color: inherit;
        text-decoration: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 720px) {
        .page {
          padding: 24px 20px 40px;
        }

        .shell {
          min-height: calc(100vh - 64px);
          display: flex;
          flex-direction: column;
        }

        .hero {
          padding: 28px 24px 34px;
        }

        .hero-top {
          grid-template-columns: minmax(0, 1fr) 96px;
          gap: 24px;
        }

        .project-logo,
        .logo-fallback {
          width: 96px;
          height: 96px;
        }

        .title {
          font-size: 2.05rem;
        }

        .stat-pill,
        .stat-pill:nth-child(-n + 2) {
          flex: 0 0 auto;
        }

        .sections {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .footer-card {
          margin-top: auto;
          padding-top: 22px;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .link-item:hover {
          background: var(--link-hover-bg);
          color: var(--color1);
          box-shadow: none;
          outline: none;
        }

        .link-item:hover .link-icon {
          color: var(--color1);
        }
      }
    </style>
  </head>
