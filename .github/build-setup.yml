- name: Setup Node
  uses: actions/setup-node@v7
  with:
    node-version: 26
# keep wasm-pack version in sync: ci.yml, .github/build-setup.yml, crates/cli/Dockerfile
- name: Install wasm-pack
  uses: taiki-e/install-action@v2
  with:
    tool: wasm-pack@0.15.1
# aws-lc-sys (pulled in by the AWS SDK) needs NASM on x86_64 Windows unless it
# uses its bundled prebuilt NASM objects (ignored on other targets)
- name: Use prebuilt NASM objects
  shell: bash
  run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
