<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="responsive-embedded-sizing" content="allow-origins=*" />
    <title>Landscape</title>
  </head>
  <body>
    <div id="landscape-embeddable-view"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      (() => {
        const urlParams = new URLSearchParams(window.location.search);
        const resizer = urlParams.get('iframe-resizer');
        if (typeof resizer !== null && resizer === 'true') {
          const script = document.createElement('script');
          script.setAttribute('src', './assets/iframeResizer.contentWindow-v4.3.9.min.js');
          document.body.appendChild(script);
        }
      })();
    </script>
    <script>
      (() => {
        if (window.parent === window || !('requestResize' in window) || !('ResizeObserver' in window)) {
          return;
        }
        let pending = false;
        const requestResize = () => {
          if (pending) return;
          pending = true;
          requestAnimationFrame(() => {
            pending = false;
            window.requestResize();
          });
        };
        new ResizeObserver(requestResize).observe(document.body);
      })();
    </script>
  </body>
</html>
